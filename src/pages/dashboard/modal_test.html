<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusFlow — Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="./modal_test.css" rel="stylesheet" />
  </head>
  <body class="page page--theme-light">
    <!-- Overlay + Modal: статично (скрытие/показ позже сделаем JS) -->
    <div class="overlay overlay--visible" aria-hidden="false"></div>

    <div
      class="task-modal task-modal--open"
      role="dialog"
      aria-modal="true"
      aria-labelledby="task-modal-title"
    >
      <div class="task-modal__dialog" role="document">
        <!-- Header -->
        <header class="task-modal__header">
          <input
            class="task-modal__title-input"
            id="task-modal-title"
            value="Task title"
            aria-label="Task title"
          />
          <button
            class="task-modal__close js-close"
            type="button"
            aria-label="Close"
          >
            ×
          </button>
        </header>

        <!-- Body: 2 columns -->
        <div class="task-modal__body">
          <!-- LEFT COLUMN -->
          <div class="task-modal__col task-modal__col--left">
            <!-- Description -->
            <section class="task-modal__section">
              <h3 class="task-modal__label">Description</h3>
              <textarea
                class="task-modal__textarea"
                rows="4"
                placeholder="Add a detailed description..."
                aria-label="Description"
              ></textarea>
            </section>

            <!-- Checklist -->
            <section class="task-modal__section">
              <div class="task-modal__section-row">
                <h3 class="task-modal__label">
                  <span class="task-modal__label-icon" aria-hidden="true"
                    >☑</span
                  >
                  Checklist
                </h3>
              </div>

              <div class="task-modal__checklist-input">
                <input
                  class="task-modal__input"
                  type="text"
                  placeholder="Add checklist item..."
                  aria-label="Checklist item"
                />
                <button
                  class="task-modal__btn task-modal__btn--primary task-modal__btn--sm js-add-checkitem"
                  type="button"
                >
                  Add
                </button>
              </div>

              <ul class="task-modal__checklist">
                <!-- Плейсхолдеры пунктов -->
                <li class="task-modal__checkitem" data-id="c1">
                  <label class="task-modal__checkitem-row">
                    <input class="task-modal__checkbox" type="checkbox" />
                    <span class="task-modal__checkitem-text"
                      >First subtask</span
                    >
                  </label>
                </li>
                <li class="task-modal__checkitem" data-id="c2">
                  <label class="task-modal__checkitem-row">
                    <input class="task-modal__checkbox" type="checkbox" />
                    <span class="task-modal__checkitem-text"
                      >Second subtask</span
                    >
                  </label>
                </li>
              </ul>
            </section>

            <!-- Attachments -->
            <section class="task-modal__section">
              <h3 class="task-modal__label">
                <span class="task-modal__label-icon" aria-hidden="true"
                  >📎</span
                >
                Attachments
              </h3>

              <div
                class="task-modal__dropzone"
                role="button"
                tabindex="0"
                aria-label="Drop files here or click to upload"
              >
                <div class="task-modal__dropzone-icon" aria-hidden="true">
                  📎
                </div>
                <div class="task-modal__dropzone-title">
                  Drop files here or click to upload
                </div>
                <button
                  class="task-modal__btn task-modal__btn--ghost task-modal__btn--sm js-upload"
                  type="button"
                >
                  Choose Files
                </button>
              </div>
            </section>

            <!-- Comments -->
            <section class="task-modal__section">
              <h3 class="task-modal__label">
                <span class="task-modal__label-icon" aria-hidden="true"
                  >💬</span
                >
                Comments
              </h3>

              <div class="task-modal__comment-row">
                <input
                  class="task-modal__input"
                  type="text"
                  placeholder="Add a comment..."
                  aria-label="Comment text"
                />
                <button
                  class="task-modal__btn task-modal__btn--primary task-modal__btn--sm"
                  type="button"
                >
                  Comment
                </button>
              </div>
            </section>
          </div>

          <!-- RIGHT COLUMN -->
          <div class="task-modal__col task-modal__col--right">
            <!-- Status -->
            <section class="task-modal__field">
              <label class="task-modal__field-label" for="status">Status</label>
              <div class="task-modal__select-wrap">
                <select
                  class="task-modal__select"
                  id="status"
                  aria-label="Status"
                >
                  <option>To Do</option>
                  <option>In Progress</option>
                  <option>Review</option>
                  <option>Done</option>
                </select>
                <span class="task-modal__select-caret" aria-hidden="true"
                  >▾</span
                >
              </div>
            </section>

            <!-- Priority -->
            <section class="task-modal__field">
              <label class="task-modal__field-label" for="priority"
                >Priority</label
              >
              <div class="task-modal__select-wrap">
                <select
                  class="task-modal__select"
                  id="priority"
                  aria-label="Priority"
                >
                  <option>Low</option>
                  <option selected>Medium</option>
                  <option>High</option>
                </select>
                <span class="task-modal__select-caret" aria-hidden="true"
                  >▾</span
                >
              </div>
            </section>

            <!-- Due Date -->
            <section class="task-modal__field">
              <label class="task-modal__field-label" for="due">Due Date</label>
              <div class="task-modal__input-icon">
                <input
                  class="task-modal__input"
                  id="due"
                  type="text"
                  placeholder="ДД.ММ.ГГГГ"
                  aria-label="Due date"
                />
                <span class="task-modal__input-addon" aria-hidden="true"
                  >📅</span
                >
              </div>
            </section>

            <!-- Tags -->
            <section class="task-modal__field">
              <div class="task-modal__field-label">Tags</div>
              <div class="task-modal__tags">
                <span class="task-modal__tag">design</span>
                <span class="task-modal__tag">develop</span>
                <span class="task-modal__tag task-modal__tag--add js-add-tag"
                  >+</span
                >
              </div>
            </section>

            <!-- Assignees -->
            <section class="task-modal__field">
              <div class="task-modal__field-label">Assignees</div>
              <div class="task-modal__assignees">
                <span class="task-modal__avatar" title="AR" aria-label="AR"
                  >AR</span
                >
                <span class="task-modal__avatar" title="SC" aria-label="SC"
                  >SC</span
                >
                <span class="task-modal__avatar" title="JK" aria-label="JK"
                  >JK</span
                >
                <span class="task-modal__avatar" title="TM" aria-label="TM"
                  >TM</span
                >
                <span class="task-modal__avatar" title="CL" aria-label="CL"
                  >CL</span
                >
                <span class="task-modal__avatar" title="MB" aria-label="MB"
                  >MB</span
                >
                <button
                  class="task-modal__avatar task-modal__avatar--add js-add-assignee"
                  type="button"
                  aria-label="Add assignee"
                >
                  +
                </button>
              </div>
            </section>

            <!-- Create -->
            <div class="task-modal__cta">
              <button
                class="task-modal__btn task-modal__btn--primary task-modal__btn--lg"
                type="button"
              >
                Create Task
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
