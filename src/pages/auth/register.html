<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../styles/main.css" />
    <title>Register</title>
  </head>
  <body>
    <main class="container">
      <section class="auth">
        <h1 class="auth__title m-0">FocusFlow ∞</h1>
        <p class="auth__subtitle">Create account</p>
        <p class="auth__description">Get started with FocusFlow today</p>
        <form class="form form__auth-container js-form" novalidate>
          <div class="form__field">
            <label class="form__label" for="name">Full Name</label>
            <input
              class="form__input"
              id="name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="Enter your name"
              required
            />
            <div class="form__error is-hidden">
              Please enter your name
            </div>
          </div>

          <div class="form__field">
            <label class="form__label" for="email">Email</label>
            <input
              class="form__input"
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
            <div class="form__error is-hidden">Enter a valid email</div>
          </div>

          <div class="form__field">
            <label class="form__label" for="password">Password</label>
            <div class="form__input-wrap">
              <input
                class="form__input"
                id="password"
                name="password"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                minlength="8"
                required
              />
              <button
                class="form__toggle js-toggle"
                type="button"
                aria-label="Toggle password visibility">
                👁
              </button>
            </div>
            <div class="form__error is-hidden">Min length is 8</div>
          </div>

          <div class="form__field">
            <label class="form__label" for="password2">Confirm password</label>
            <div class="form__input-wrap">
              <input
                class="form__input"
                id="password2"
                name="password2"
                type="password"
                autocomplete="new-password"
                placeholder="••••••••"
                minlength="8"
                required
              />
              <button
                class="form__toggle js-toggle"
                type="button"
                aria-label="Toggle password visibility">
                👁
              </button>
            </div>
            <div class="form__error is-hidden">Passwords must match</div>
          </div>

          <button class="btn btn__primary js-submit" type="submit">
            Create account
          </button>

          <div class="form__meta">
            Already have an account?
            <a class="form__link" href="./login.html">Sign in</a>
          </div>

          <!-- Глобальные состояния формы (через JS классом) -->
          <div class="form__alert form__alert-error is-hidden mt-4">Server error</div>
          <div class="alert form__alert-info is-hidden mt-4">Creating account…</div>
        </form>
      </section>
    </main>

    <!-- Toasts -->
    <div class="toast is-hidden">
      <div class="toast__item">Account created</div>
    </div>
  </body>
</html>
